name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: python -m pip install --disable-pip-version-check -e .

      - name: Validate source and formatting
        run: make validate

      - name: Reproduce scripted evidence
        run: make reproduce

      - name: Verify code-agent gate semantics
        shell: bash
        run: |
          set +e
          PYTHONPATH=src python -m agent_eval.cli gate \
            --input traces/code-agent-scripted.jsonl > /tmp/code-agent-gate.json
          gate_status=$?
          set -e
          test "$gate_status" -eq 1
          python - <<'PY'
          import json
          gate = json.load(open("/tmp/code-agent-gate.json"))
          assert gate["checks"]["m1_security_upper_below_zero"]["status"] == "PASS"
          assert gate["checks"]["m1_clean_lower_above_margin"]["status"] == "INCONCLUSIVE"
          assert gate["checks"]["m2_executed_asr_zero"]["status"] == "PASS"
          assert gate["checks"]["m2_clean_false_block_at_most_10pct"]["status"] == "PASS"
          PY

      - name: Replay hosted trace
        run: >-
          PYTHONPATH=src python -m agent_eval.cli replay
          --input traces/live/gpt-5-4.jsonl
          --output /tmp/gpt-5-4-replayed.jsonl

      - name: Replay positive-control trace
        run: >-
          PYTHONPATH=src python -m agent_eval.cli replay
          --input traces/live/gpt-5-4-positive-control.jsonl
          --output /tmp/gpt-5-4-positive-control-replayed.jsonl

      - name: Regenerate hosted evidence
        run: make report-openai

      - name: Regenerate positive-control evidence
        run: make report-positive-control

      - name: Verify expected hosted gate result
        shell: bash
        run: |
          set +e
          PYTHONPATH=src python -m agent_eval.cli gate \
            --input traces/live/gpt-5-4.jsonl > /tmp/openai-gate.json
          gate_status=$?
          set -e
          test "$gate_status" -eq 1
          cmp /tmp/openai-gate.json reports/generated/openai-gate.json

      - name: Verify expected positive-control gate result
        shell: bash
        run: |
          set +e
          PYTHONPATH=src python -m agent_eval.cli gate \
            --input traces/live/gpt-5-4-positive-control.jsonl > /tmp/positive-control-gate.json
          gate_status=$?
          set -e
          test "$gate_status" -eq 1
          cmp /tmp/positive-control-gate.json reports/generated/positive-control-gate.json

      - name: Verify generated artifacts are current
        run: git diff --exit-code
