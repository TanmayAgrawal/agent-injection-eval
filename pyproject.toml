[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-injection-eval"
version = "0.2.0"
description = "A reproducible evaluation harness for retrieved prompt injection in tool-using agents"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
agent-eval = "agent_eval.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

